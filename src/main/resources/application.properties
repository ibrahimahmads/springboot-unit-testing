spring.application.name=tokonyadia

# untuk mendefine port server
server.port=8080
# mendefine driver database (postgres)
spring.datasource.driver-class-name=org.postgresql.Driver
#untuk mengarahkan url ke db yang digunakan
spring.datasource.url=jdbc:postgresql://localhost:5432/tokonyadia_db
# untuk define username
spring.datasource.username=postgres
#untuk define password
spring.datasource.password=dynabook
#define hibernate dialect
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.PostgreSQLDialect
# mentranslate Capital letter to _
# spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImproveNamingStrategy
#show query
spring.jpa.show-sql=true
#auto generate table
spring.jpa.hibernate.ddl-auto=update

jwt.secret=secret-key-belajar-jwt-yang-minimal-32-char
jwt.expiration=3600000

app.admin.username=admin
app.admin.password=admin123